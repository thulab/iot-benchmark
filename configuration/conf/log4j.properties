# log4j 1.2 configuration (compatible with reload4j).
# Used when SLF4J selects the reload4j binding on the classpath, e.g. the
# iotdb modules whose lib ships logback-classic 1.3.x (invisible to
# slf4j-api 1.7) so SLF4J falls back to slf4j-reload4j.  Without this file
# log4j warns "No appenders could be found" and every LOGGER output
# (including the latency matrix) is silently dropped.
# The conf directory is on the classpath (see bin/startup.sh), so log4j 1.2
# picks this file up automatically.
log4j.rootLogger=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %c{1}:%L - %m%n
